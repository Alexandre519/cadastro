<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        
        .campo {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        
        .erro {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #357ae8;
        }
        
        .sucesso {
            text-align: center;
            color: #2ecc71;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastrog</h1>
        <form id="meuFormulario">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <div class="erro" id="erroNome">Por favor, insira seu nome</div>
            </div>
            
            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <div class="erro" id="erroEmail">Por favor, insira um email válido</div>
            </div>
            
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <div class="erro" id="erroSenha">A senha deve ter pelo menos 8 caracteres</div>
            </div>
            
            <div class="campo">
                <label for="celular">Celular:</label>
                <input type="tel" id="celular" name="celular" required>
                <div class="erro" id="erroCelular">O celular deve ter 11 números</div>
            </div>
            
            <button type="submit">Enviar</button>
            <div class="sucesso" id="sucesso">Formulário enviado com sucesso!</div>
        </form>
    </div>

    <script>
        document.getElementById('meuFormulario').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Limpar mensagens de erro anteriores
            document.querySelectorAll('.erro').forEach(function(erro) {
                erro.style.display = 'none';
            });
            document.getElementById('sucesso').style.display = 'none';
            
            let valido = true;
            
            // Validar Nome
            const nome = document.getElementById('nome').value.trim();
            if (nome === '') {
                document.getElementById('erroNome').style.display = 'block';
                valido = false;
            }
            
            // Validar Email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('erroEmail').style.display = 'block';
                valido = false;
            }
            
            // Validar Senha
            const senha = document.getElementById('senha').value;
            if (senha.length < 8) {
                document.getElementById('erroSenha').style.display = 'block';
                valido = false;
            }
            
            // Validar Celular
            const celular = document.getElementById('celular').value.replace(/\D/g, '');
            if (celular.length !== 11) {
                document.getElementById('erroCelular').style.display = 'block';
                valido = false;
            }
            
            // Se tudo estiver válido, mostrar mensagem de sucesso
            if (valido) {
                document.getElementById('sucesso').style.display = 'block';
                // Aqui você poderia enviar os dados para um servidor
                console.log('Dados válidos:', { nome, email, senha, celular });
            }
        });
    </script>
</body>
</html>p
